<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Administrador</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
padding:20px;
margin:0;
}

h1{
text-align:center;
margin-bottom:20px;
}

#usuarios{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(300px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:10px;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
border:none;
background:#28a745;
color:white;
font-size:16px;
border-radius:10px;
cursor:pointer;
}

</style>

</head>

<body>

<h1>Panel Administrador</h1>

<div id="usuarios">

</div>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
getDocs,
doc,
updateDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyDLfYfeuBHDPNbswPm9oCe-CbNJw0Z4fOk",

authDomain: "novatech-e0294.firebaseapp.com",

projectId: "novatech-e0294",

storageBucket: "novatech-e0294.firebasestorage.app",

messagingSenderId: "1050314267105",

appId: "1:1050314267105:web:852be575be54696e911aa0"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

async function cargarUsuarios(){

const usuariosDiv =
document.getElementById(
"usuarios"
);

usuariosDiv.innerHTML =
"";

const querySnapshot =
await getDocs(
collection(db,"usuarios")
);

querySnapshot.forEach((docu)=>{

const datos =
docu.data();

usuariosDiv.innerHTML += `

<div class="card">

<h2>${datos.nombre}</h2>

<p>${datos.email}</p>

<p>Saldo:
DOP ${datos.saldo}</p>

<p>Plan:
${datos.plan}</p>

<input
type="number"
placeholder="Agregar saldo"
id="saldo-${docu.id}"
>

<button
onclick="agregarSaldo('${docu.id}')"
>

Agregar saldo

</button>

</div>

`;

});

}

window.agregarSaldo =
async function(id){

const monto =
parseFloat(

document.getElementById(
"saldo-" + id
).value

);

const usuarioRef =
doc(db,"usuarios",id);

await updateDoc(usuarioRef,{

saldo:monto

});

alert("Saldo actualizado");

cargarUsuarios();

}

cargarUsuarios();

</script>

</body>

</html>
