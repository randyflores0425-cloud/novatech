<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Comprar Plan</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f5f5f5;
padding:20px;
}

h1{
text-align:center;
margin-bottom:20px;
}

.plan{
background:white;
padding:25px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.plan h2{
margin-bottom:15px;
}

.plan p{
margin-bottom:10px;
font-size:16px;
}

input,select{

width:100%;
padding:14px;
margin-top:10px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #ccc;
font-size:15px;

}

button{

width:100%;
padding:14px;
background:#28a745;
border:none;
color:white;
font-size:16px;
border-radius:10px;
cursor:pointer;
font-weight:bold;

}

button:hover{
background:#218838;
}

</style>

</head>

<body>

<h1>Comprar Plan</h1>

<div class="plan">

<h2>
Datos de Pago
</h2>

<p>
<strong>Banco:</strong>
Banreservas
</p>

<p>
<strong>Cuenta:</strong>
9606810364
</p>

<p>
<strong>Titular:</strong>
Welinson Batista Tejeda
</p>

</div>

<div class="plan">

<h2>
Enviar Comprobante
</h2>

<input
type="text"
id="nombre"
placeholder="Tu nombre completo"
>

<select id="plan">

<option>
Plan Básico - 1000
</option>

<option>
Plan Premium - 6000
</option>

<option>
Plan VIP - 8000
</option>

</select>

<input
type="file"
id="comprobante"
>

<button id="btnEnviar">

Enviar Comprobante

</button>

</div>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
addDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyDLfYfeuBHDPNbswPm9oCe-CbNJw0Z4fOk",

authDomain: "novatech-e0294.firebaseapp.com",

projectId: "novatech-e0294",

storageBucket: "novatech-e0294.firebasestorage.app",

messagingSenderId: "1050314267105",

appId: "1:1050314267105:web:852be575be54696e911aa0"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

document
.getElementById("btnEnviar")
.addEventListener("click", async()=>{

const nombre =
document.getElementById("nombre").value;

const plan =
document.getElementById("plan").value;

if(nombre==""){

alert("Ingresa tu nombre");

return;

}

try{

await addDoc(

collection(db,"depositos"),

{

nombre:nombre,

plan:plan,

estado:"pendiente",

fecha:Date.now()

}

);

alert(
"Comprobante enviado correctamente"
);

document.getElementById("nombre").value="";

}
catch(error){

alert(error.message);

}

});

</script>

</body>

</html>
