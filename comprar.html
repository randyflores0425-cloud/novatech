<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Comprar Plan</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
padding:20px;
margin:0;
}

h1{
text-align:center;
margin-bottom:20px;
}

.planes{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.plan{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
text-align:center;
}

button{
width:100%;
padding:14px;
margin-top:15px;
border:none;
background:#28a745;
color:white;
font-size:16px;
border-radius:10px;
cursor:pointer;
}

</style>

</head>

<body>

<h1>Comprar Plan</h1>

<div class="planes">

<div class="plan">

<h2>Plan Básico</h2>

<h3>DOP 1,000</h3>

<p>
Ganancia diaria 8%
</p>

<button onclick="comprar('Plan Básico')">

Comprar

</button>

</div>

<div class="plan">

<h2>Plan Premium</h2>

<h3>DOP 6,000</h3>

<p>
Ganancia diaria 8%
</p>

<button onclick="comprar('Plan Premium')">

Comprar

</button>

</div>

<div class="plan">

<h2>Plan VIP</h2>

<h3>DOP 8,000</h3>

<p>
Ganancia diaria 8%
</p>

<button onclick="comprar('Plan VIP')">

Comprar

</button>

</div>

</div>

<script>

function comprar(plan){

alert(
"Seleccionaste " + plan
);

window.location.href =
"https://wa.me/18298177882";

}

</script>

</body>

</html>
