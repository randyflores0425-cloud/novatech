<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Comprar Plan</title>

<link rel="stylesheet" href="style.css">

<style>

.box{

background:white;
padding:25px;
border-radius:20px;
width:90%;
max-width:500px;
margin:40px auto;
box-shadow:0 0 10px rgba(0,0,0,0.1);

}

.box input,
.box select{

width:100%;
padding:14px;
margin-top:10px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;

}

.box button{

width:100%;
padding:14px;
background:#28a745;
border:none;
color:white;
font-size:16px;
border-radius:10px;
cursor:pointer;

}

</style>

</head>

<body>

<div class="box">

<h1>

Comprar Plan

</h1>

<h3>

Datos de Pago

</h3>

<p>
Banco: Banreservas
</p>

<p>
Cuenta: 9606810364
</p>

<p>
Titular:
Welinson Batista Tejeda
</p>

<hr>

<input
type="text"
id="nombre"
placeholder="Tu nombre"
>

<select id="plan">

<option>
PLAN START - 1000
</option>

<option>
PLAN PLUS - 2000
</option>

<option>
PLAN ULTRA - 8000
</option>

<option>
PLAN ELITE - 15000
</option>

</select>

<input
type="file"
id="comprobante"
>

<button id="btnEnviar">

Enviar Comprobante

</button>

</div>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
addDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyDLfYfeuBHDPNbswPm9oCe-CbNJw0Z4fOk",

authDomain: "novatech-e0294.firebaseapp.com",

projectId: "novatech-e0294",

storageBucket: "novatech-e0294.appspot.com",

messagingSenderId: "1050314267105",

appId: "1:1050314267105:web:852be575be54696e911aa0"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

document
.getElementById("btnEnviar")

.addEventListener("click", async()=>{

const nombre =
document.getElementById("nombre").value;

const plan =
document.getElementById("plan").value;

try{

await addDoc(

collection(db,"depositos"),

{

nombre:nombre,
plan:plan,
estado:"pendiente",
fecha:Date.now()

}

);

alert(
"Comprobante enviado"
);

}
catch(error){

alert(error.message);

}

});

</script>

</body>

</html>
