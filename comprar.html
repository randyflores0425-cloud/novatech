<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Comprar Plan</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
padding:20px;
margin:0;
}

.plan{
background:white;
padding:25px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

button{
width:100%;
padding:14px;
background:#28a745;
border:none;
color:white;
font-size:16px;
border-radius:10px;
cursor:pointer;
margin-top:15px;
}

input,select{
width:100%;
padding:14px;
margin-top:10px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;
}

</style>

</head>

<body>

<h1>Comprar Plan</h1>

<div class="plan">

<h2>Cuenta de Pago</h2>

<p>
Banco: Banreservas
</p>

<p>
Cuenta: 123456789
</p>

<p>
Titular: NOVATECH CLUB
</p>

</div>

<div class="plan">

<input
type="text"
id="nombre"
placeholder="Tu nombre"
>

<select id="plan">

<option>
Plan Básico - 1000
</option>

<option>
Plan Premium - 6000
</option>

<option>
Plan VIP - 8000
</option>

</select>

<input
type="file"
id="comprobante"
>

<button onclick="enviar()">

Enviar Comprobante

</button>

</div>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
addDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyDLfYfeuBHDPNbswPm9oCe-CbNJw0Z4fOk",

authDomain: "novatech-e0294.firebaseapp.com",

projectId: "novatech-e0294",

storageBucket: "novatech-e0294.firebasestorage.app",

messagingSenderId: "1050314267105",

appId: "1:1050314267105:web:852be575be54696e911aa0"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

window.enviar =
async function(){

const nombre =
document.getElementById("nombre").value;

const plan =
document.getElementById("plan").value;

await addDoc(

collection(db,"depositos"),

{
nombre:nombre,
plan:plan,
estado:"pendiente",
fecha:Date.now()
}

);

alert(
"Comprobante enviado"
);

}

</script>

</body>

</html>
