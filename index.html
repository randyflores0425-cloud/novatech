<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
    <title>NOVATECH CLUB - Mi Perfil</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="profile-header">
        <div class="user-info-row">
            <div class="user-avatar">
                <i class="fa-solid fa-user-astronaut"></i>
            </div>
            <div class="user-meta">
                <h2 class="brand-title">NOVATECH CLUB</h2>
                <div id="user-email" class="user-email-text">Cargando usuario...</div>
            </div>
        </div>

        <div class="balance-board">
            <div class="balance-box">
                <span class="balance-label"><i class="fa-solid fa-wallet"></i> Saldo de la cuenta</span>
                <span id="useramount" class="balance-value">DOP 0.00</span>
            </div>
            <div class="balance-divider"></div>
            <div class="balance-box">
                <span class="balance-label"><i class="fa-solid fa-chart-line"></i> Ingresos acumulados</span>
                <span id="all_income" class="balance-value">DOP 0.00</span>
            </div>
        </div>
    </div>

    <div class="action-grid">
        <button class="action-btn" id="btn-recharge">
            <i class="fa-solid fa-money-bill-transfer"></i>
            <span>Recargar</span>
        </button>
        <button class="action-btn" id="btn-withdraw">
            <i class="fa-solid fa-building-columns"></i>
            <span>Retirar</span>
        </button>
        <a href="https://chat.whatsapp.com/IfgCgvipDkhK9lkXoq99wW" target="_blank" class="action-btn text-decoration-none">
            <i class="fa-brands fa-whatsapp text-success"></i>
            <span>Grupo de WhatsApp</span>
        </a>
    </div>

    <div class="section-container" id="deposit-section">
        <h3 class="section-title"><i class="fa-solid fa-shield-halved"></i> Datos para Recargar Cuenta</h3>
        
        <div class="bank-card b-reservas">
            <div class="bank-logo-area">
                <i class="fa-solid fa-vault"></i>
            </div>
            <div class="bank-info-area">
                <span class="bank-name">Banreservas</span>
                <span class="bank-holder">Titular: Welinson Batista Tejeda</span>
                <div class="account-number-wrapper">
                    <span class="bank-account" id="acc-reservas">9606810364</span>
                    <button class="copy-btn" onclick="copyToClipboard('9606810364')"><i class="fa-regular fa-copy"></i></button>
                </div>
            </div>
        </div>

        <div class="bank-card b-popular">
            <div class="bank-logo-area">
                <i class="fa-solid fa-handshake-angle"></i>
            </div>
            <div class="bank-info-area">
                <span class="bank-name">Banco Popular</span>
                <span class="bank-holder">Titular: Franklin Fernández</span>
                <div class="account-number-wrapper">
                    <span class="bank-account" id="acc-popular">809480569</span>
                    <button class="copy-btn" onclick="copyToClipboard('809480569')"><i class="fa-regular fa-copy"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div class="options-list">
        <div class="option-item" id="btn-logout">
            <i class="fa-solid fa-arrow-right-from-bracket text-danger"></i>
            <span>Cerrar Sesión</span>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <script src="firebase.js"></script>
    <script src="app.js"></script>

    <script>
        // Función rápida para copiar los números de cuenta en el celular
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert("Número de cuenta copiado: " + text);
            }).catch(err => {
                console.error("Error al copiar cuenta: ", err);
            });
        }
    </script>
</body>
</html>
