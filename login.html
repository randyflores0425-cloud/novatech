<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login - NOVATECH CLUB</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.caja{

background:white;
padding:30px;
border-radius:20px;
width:100%;
max-width:450px;
box-shadow:0 0 15px rgba(0,0,0,0.1);

}

.logo{

text-align:center;
font-size:28px;
font-weight:bold;
margin-bottom:20px;
color:#ff9800;

}

h1{

text-align:center;
margin-bottom:25px;

}

input{

width:100%;
padding:14px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #ccc;
font-size:15px;

}

button{

width:100%;
padding:14px;
background:#28a745;
border:none;
color:white;
font-size:16px;
border-radius:10px;
cursor:pointer;
font-weight:bold;

}

.link{

text-align:center;
margin-top:20px;

}

.link a{

text-decoration:none;
color:#2196f3;
font-weight:bold;

}

</style>

</head>

<body>

<div class="caja">

<div class="logo">
NOVATECH CLUB
</div>

<h1>
Iniciar Sesión
</h1>

<input
type="email"
id="email"
placeholder="Correo electrónico"
>

<input
type="password"
id="password"
placeholder="Contraseña"
>

<button onclick="login()">

Ingresar

</button>

<div class="link">

¿No tienes cuenta?

<a href="registro.html">

Registrarse

</a>

</div>

</div>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getAuth,
signInWithEmailAndPassword

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey: "TU_APIKEY",

authDomain: "TU_AUTHDOMAIN",

projectId: "TU_PROJECTID",

storageBucket: "TU_STORAGEBUCKET",

messagingSenderId: "TU_MESSAGINGSENDERID",

appId: "TU_APPID"

};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

window.login =
async function(){

const email =
document.getElementById(
"email"
).value;

const password =
document.getElementById(
"password"
).value;

if(
email=="" ||
password==""
){

alert(
"Completa todos los campos"
);

return;

}

try{

await signInWithEmailAndPassword(

auth,
email,
password

);

alert(
"Bienvenido"
);

window.location.href =
"panel.html";

}

catch(error){

alert(error.message);

}

}

</script>

</body>

</html>
