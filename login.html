<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novatech - Ingreso</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin: 0; background-color: #060d1a; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .auth-container { background-color: #0d1b2e; border: 1px solid #162942; width: 100%; max-width: 360px; padding: 25px; border-radius: 16px; text-align: center; }
        .logo { font-size: 1.8rem; font-weight: bold; color: #fff; margin-bottom: 5px; letter-spacing: 1px; }
        .subtitle { color: #8a99ad; font-size: 0.85rem; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; position: relative; text-align: left; }
        .input-group label { display: block; font-size: 0.8rem; color: #8a99ad; margin-bottom: 5px; }
        .input-group input { width: 100%; background-color: #060d1a; border: 1px solid #162942; padding: 12px; border-radius: 8px; color: #fff; font-size: 0.95rem; box-sizing: border-box; }
        .input-group input:focus { border-color: #0066ff; outline: none; }
        .auth-btn { width: 100%; background: linear-gradient(135deg, #0066ff, #0044cc); border: none; padding: 12px; border-radius: 8px; color: #fff; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 15px; }
        .switch-link { margin-top: 20px; font-size: 0.85rem; color: #8a99ad; }
        .switch-link a { color: #d4af37; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo"><i class="fas fa-satellite-dish" style="color: #0066ff; margin-right: 8px;"></i>NOVATECH</div>
        <div class="subtitle">Ingresa a tu panel de control</div>

        <form id="login-form">
            <div class="input-group">
                <label>Correo Electrónico</label>
                <input type="email" id="log-email" required placeholder="tu@correo.com">
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="log-password" required placeholder="******">
            </div>
            <button type="submit" class="auth-btn">Iniciar Sesión</button>
        </form>

        <div class="switch-link">
            ¿No eres miembro? <a href="registro.html">Regístrate gratis</a>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
