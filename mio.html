<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novatech - Perfil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #030e20; color: #ffffff; padding-bottom: 70px; }
        
        .profile-header { background: linear-gradient(135deg, #0a192f, #112240); padding: 25px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #112240; }
        .avatar { width: 60px; height: 60px; background: #e4b363; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #000; font-size: 1.8rem; }
        .user-info h2 { font-size: 1.1rem; }
        .vip-badge { background: linear-gradient(90deg, #c59341, #e4b363); color: #000; padding: 2px 8px; font-size: 0.7rem; font-weight: bold; border-radius: 3px; display: inline-block; margin-top: 5px; }

        .balance-container { display: grid; grid-template-columns: 1fr 1fr; background: #0a192f; padding: 15px; margin: 15px 10px; border-radius: 8px; border: 1px solid #112240; text-align: center; }
        .bal-box { border-right: 1px solid #112240; }
        .bal-box:last-child { border-right: none; }
        .bal-box span { display: block; font-size: 1.2rem; font-weight: bold; color: #e4b363; }
        .bal-box label { font-size: 0.75rem; color: #8892b0; }

        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 15px 10px; }
        .btn-act { padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
        .btn-recharge { background: linear-gradient(90deg, #c59341, #e4b363); color: #000; }
        .btn-withdraw { background: #112240; color: #fff; border: 1px solid #00b4d8; }

        /* Menú de Opciones */
        .menu-list { background: #0a192f; margin: 15px 10px; border-radius: 8px; border: 1px solid #112240; overflow: hidden; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; color: #fff; text-decoration: none; border-bottom: 1px solid #112240; font-size: 0.9rem; }
        .menu-item:last-child { border-bottom: none; }
        .menu-left { display: flex; align-items: center; gap: 12px; }
        .menu-left i { color: #e4b363; font-size: 1.1rem; width: 20px; text-align: center; }
        .menu-item i.fa-chevron-right { color: #8892b0; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="profile-header">
        <div class="avatar"><i class="fas fa-user-astronaut"></i></div>
        <div class="user-info">
            <h2 id="userPhone">+1 8298177882</h2>
            <div class="vip-badge">VIP 0</div>
        </div>
    </div>

    <div class="balance-container">
        <div class="bal-box">
            <span id="profileBalance">DOP 200.00</span>
            <label>Saldo de la cuenta</label>
        </div>
        <div class="bal-box">
            <span>DOP 0.00</span>
            <label>Ingresos acumulados</label>
        </div>
    </div>

    <div class="action-grid">
        <button class="btn-act btn-recharge" onclick="location.href='recargar.html'">Recargar</button>
        <button class="btn-act btn-withdraw" onclick="location.href='retirar.html'">Retirar dinero</button>
    </div>

    <div class="menu-list">
        <a href="#" class="menu-item"><div class="menu-left"><i class="fas fa-clover"></i>Sorteo de la suerte</div><i class="fas fa-chevron-right"></i></a>
        <a href="#" class="menu-item"><div class="menu-left"><i class="fas fa-file-invoice"></i>Reglas de la plataforma</div><i class="fas fa-chevron-right"></i></a>
        <a href="#" id="whatsappSupportMenu" class="menu-item" target="_blank"><div class="menu-left"><i class="fas fa-headset"></i>Servicio al cliente</div><i class="fas fa-chevron-right"></i></a>
        <a href="#" class="menu-item"><div class="menu-left"><i class="fas fa-history"></i>Historial de la cuenta</div><i class="fas fa-chevron-right"></i></a>
        <a href="cuentas.html" class="menu-item"><div class="menu-left"><i class="fas fa-credit-card"></i>Gestión de retiros bancarios</div><i class="fas fa-chevron-right"></i></a>
        <a href="#" class="menu-item" onclick="logout()"><div class="menu-left"><i class="fas fa-power-off"></i>Finalizar la sesión</div><i class="fas fa-chevron-right"></i></a>
    </div>

    <div class="nav-bar">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i>Hogar</a>
        <a href="comprar.html" class="nav-item"><i class="fas fa-box"></i>Producto</a>
        <a href="index.html" class="nav-center">V</a>
        <a href="equipo.html" class="nav-item"><i class="fas fa-users"></i>Equipo</a>
        <a href="mio.html" class="nav-item active"><i class="fas fa-user"></i>Mío</a>
    </div>

    <script src="app.js"></script>
</body>
</html>
