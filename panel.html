<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Panel</title>

<link rel="stylesheet" href="style.css">

<style>

.panel{

padding:20px;

}

.card{

background:white;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);

}

button{

padding:14px 20px;
border:none;
background:red;
color:white;
border-radius:10px;
cursor:pointer;

}

</style>

</head>

<body>

<div class="panel">

<h1>

Panel Usuario

</h1>

<div class="card">

<h2 id="email">

Cargando...

</h2>

<p>
Bienvenido a NOVATECH CLUB
</p>

</div>

<div class="card">

<h3>Plan Actual</h3>

<p>
Sin plan activo
</p>

</div>

<div class="card">

<h3>Ganancias</h3>

<p>
DOP 0
</p>

</div>

<button id="logout">

Cerrar Sesión

</button>

</div>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getAuth,
onAuthStateChanged,
signOut

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey: "AIzaSyDLfYfeuBHDPNbswPm9oCe-CbNJw0Z4fOk",

authDomain: "novatech-e0294.firebaseapp.com",

projectId: "novatech-e0294",

storageBucket: "novatech-e0294.appspot.com",

messagingSenderId: "1050314267105",

appId: "1:1050314267105:web:852be575be54696e911aa0"

};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

onAuthStateChanged(auth,(user)=>{

if(user){

document.getElementById("email")
.innerHTML = user.email;

}else{

window.location.href =
"login.html";

}

});

document.getElementById("logout")

.addEventListener("click", async()=>{

await signOut(auth);

window.location.href =
"login.html";

});

</script>

</body>

</html>
