<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel Usuario</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
padding:20px;
margin:0;
}

header{
background:#000;
color:white;
padding:20px;
border-radius:20px;
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.card{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
text-align:center;
}

button{
width:100%;
padding:14px;
margin-top:15px;
border:none;
background:#28a745;
color:white;
font-size:16px;
border-radius:10px;
cursor:pointer;
}

a{
text-decoration:none;
}

</style>

</head>

<body>

<header>

<h1>NOVATECH CLUB</h1>

<p id="nombre">

Cargando...

</p>

</header>

<div class="cards">

<div class="card">

<h2>Saldo</h2>

<p id="saldo">
DOP 0
</p>

</div>

<div class="card">

<h2>Plan</h2>

<p id="plan">
Sin plan
</p>

</div>

<div class="card">

<h2>Ganancias</h2>

<p id="ganancias">
DOP 0
</p>

</div>

</div>

<a href="comprar.html">

<button>

Comprar Plan

</button>

</a>

<button onclick="cerrarSesion()">

Cerrar Sesión

</button>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getAuth,
onAuthStateChanged,
signOut

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {

getFirestore,
doc,
getDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyDLfYfeuBHDPNbswPm9oCe-CbNJw0Z4fOk",

authDomain: "novatech-e0294.firebaseapp.com",

projectId: "novatech-e0294",

storageBucket: "novatech-e0294.firebasestorage.app",

messagingSenderId: "1050314267105",

appId: "1:1050314267105:web:852be575be54696e911aa0"

};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

onAuthStateChanged(auth,
async(user)=>{

if(user){

const ref =
doc(db,"usuarios",user.uid);

const snap =
await getDoc(ref);

if(snap.exists()){

const datos =
snap.data();

document.getElementById(
"nombre"
).innerHTML =
datos.nombre;

document.getElementById(
"saldo"
).innerHTML =
"DOP " + datos.saldo;

document.getElementById(
"plan"
).innerHTML =
datos.plan;

document.getElementById(
"ganancias"
).innerHTML =
"DOP " + datos.ganancias;

}

}else{

window.location.href =
"login.html";

}

});

window.cerrarSesion =
async function(){

await signOut(auth);

window.location.href =
"login.html";

}

</script>

</body>

</html>
