<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Panel Usuario - NOVATECH CLUB</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f5f5f5;
padding:20px;
}

/* HEADER */

header{
background:#000;
color:white;
padding:20px;
border-radius:20px;
margin-bottom:20px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}

.logo{
font-size:24px;
font-weight:bold;
}

.saludo{
font-size:14px;
}

/* TARJETAS */

.cards{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:20px;
}

.card{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
text-align:center;
}

.card h2{
margin-bottom:10px;
font-size:20px;
}

.card p{
font-size:18px;
font-weight:bold;
color:#28a745;
}

/* RETIRO */

.retiro{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
margin-bottom:20px;
}

.retiro h2{
margin-bottom:15px;
}

input{
width:100%;
padding:14px;
margin-top:10px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #ccc;
font-size:15px;
}

button{
width:100%;
padding:14px;
border:none;
background:#28a745;
color:white;
font-size:16px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#218838;
}

/* REFERIDOS */

.ref{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
margin-bottom:20px;
}

.linkref{
background:#f0f0f0;
padding:15px;
border-radius:10px;
word-break:break-all;
margin-top:15px;
}

/* SOPORTE */

.soporte{
background:#000;
color:white;
padding:25px;
border-radius:20px;
text-align:center;
}

.soporte a{
display:inline-block;
margin-top:15px;
padding:14px 20px;
background:#25D366;
color:white;
text-decoration:none;
border-radius:10px;
font-weight:bold;
}

/* BOTON SALIR */

.salir{
margin-top:20px;
background:#dc3545;
}

</style>

</head>

<body>

<header>

<div>

<div class="logo">
NOVATECH CLUB
</div>

<div class="saludo">

Bienvenido:
<span id="nombre">
Usuario
</span>

</div>

</div>

</header>

<!-- TARJETAS -->

<div class="cards">

<div class="card">

<h2>
Saldo
</h2>

<p id="saldo">
DOP 0
</p>

</div>

<div class="card">

<h2>
Plan Activo
</h2>

<p id="plan">
Sin plan
</p>

</div>

<div class="card">

<h2>
Ganancias
</h2>

<p id="ganancias">
DOP 0
</p>

</div>

<div class="card">

<h2>
Referidos
</h2>

<p id="referidos">
0
</p>

</div>

</div>

<!-- RETIRO -->

<div class="retiro">

<h2>
Solicitar Retiro
</h2>

<p>
Mínimo DOP 250
</p>

<p>
Comisión 8%
</p>

<input
type="number"
id="montoRetiro"
placeholder="Monto a retirar"
>

<button onclick="solicitarRetiro()">

Solicitar Retiro

</button>

</div>

<!-- REFERIDOS -->

<div class="ref">

<h2>
Tu Link de Referido
</h2>

<p>
Comparte este enlace y gana bonos.
</p>

<div
class="linkref"
id="linkReferido"
>

</div>

</div>

<!-- SOPORTE -->

<div class="soporte">

<h2>
Soporte Oficial
</h2>

<p>
Problemas con depósitos o retiros
</p>

<a href="https://wa.me/18298177882">

WhatsApp 829-817-7882

</a>

<button
class="salir"
onclick="cerrarSesion()"
>

Cerrar Sesión

</button>

</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getAuth,
onAuthStateChanged,
signOut

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {

getFirestore,
doc,
getDoc,
collection,
addDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "TU_APIKEY",

authDomain: "TU_AUTHDOMAIN",

projectId: "TU_PROJECTID",

storageBucket: "TU_STORAGEBUCKET",

messagingSenderId: "TU_MESSAGINGSENDERID",

appId: "TU_APPID"

};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

onAuthStateChanged(auth,
async(user)=>{

if(user){

const ref =
doc(db,"usuarios",user.uid);

const snap =
await getDoc(ref);

if(snap.exists()){

const datos =
snap.data();

document.getElementById(
"nombre"
).innerHTML =
datos.nombre;

document.getElementById(
"saldo"
).innerHTML =
"DOP " + datos.saldo;

document.getElementById(
"plan"
).innerHTML =
datos.plan;

document.getElementById(
"ganancias"
).innerHTML =
"DOP " + datos.ganancias;

document.getElementById(
"referidos"
).innerHTML =
datos.referidos;

document.getElementById(
"linkReferido"
).innerHTML =

window.location.origin +

"/registro.html?ref=" +

user.uid;

}

}else{

window.location.href =
"login.html";

}

});

window.solicitarRetiro =
async function(){

const monto =
parseFloat(

document.getElementById(
"montoRetiro"
).value

);

if(!monto){

alert("Ingresa monto");

return;

}

if(monto < 250){

alert(
"El retiro mínimo es 250"
);

return;

}

const user =
auth.currentUser;

await addDoc(

collection(db,"retiros"),

{

usuario:user.uid,

monto:monto,

estado:"pendiente",

fecha:Date.now()

}

);

alert(
"Solicitud enviada"
);

}

window.cerrarSesion =
async function(){

await signOut(auth);

window.location.href =
"login.html";

}

</script>

</body>

</html>
