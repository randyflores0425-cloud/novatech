<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Panel Usuario</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial;
background:#f5f5f5;
}

header{
background:#000;
color:white;
padding:15px;
text-align:center;
}

.card{
background:white;
margin:15px;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

button{
width:100%;
padding:12px;
border:none;
background:#28a745;
color:white;
font-size:16px;
border-radius:10px;
margin-top:10px;
cursor:pointer;
}

.referido{
background:#ff9800;
color:white;
padding:10px;
border-radius:10px;
word-break:break-all;
}

</style>

</head>

<body>

<header>

<h1>PANEL DE USUARIO</h1>

</header>

<div class="card">

<h2 id="nombre"></h2>

<p>
Saldo:
<b id="saldo">
DOP 0
</b>
</p>

<p>
Ganancias:
<b id="ganancias">
DOP 0
</b>
</p>

</div>

<div class="card">

<h3>Link de Referido</h3>

<div class="referido"
id="linkReferido">
</div>

<button onclick="copiar()">
Copiar Link
</button>

</div>

<div class="card">

<h3>Retiro</h3>

<p>
Mínimo retiro:
DOP 250
</p>

<p>
Comisión:
8%
</p>

<button onclick="retirar()">
Solicitar Retiro
</button>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "TU_APIKEY",

authDomain: "TU_DOMINIO",

projectId: "TU_PROJECTID",

storageBucket: "TU_STORAGE",

messagingSenderId: "TU_SENDERID",

appId: "TU_APPID"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

onAuthStateChanged(auth, async(user)=>{

if(user){

const ref =
doc(db,"usuarios",user.uid);

const snap =
await getDoc(ref);

const datos = snap.data();

document.getElementById("nombre").innerHTML =
datos.nombre;

document.getElementById("saldo").innerHTML =
"DOP " + datos.saldo;

document.getElementById("ganancias").innerHTML =
"DOP " + datos.ganancias;

document.getElementById("linkReferido").innerHTML =
window.location.origin +
"/registro.html?ref=" +
user.uid;

}else{

window.location="login.html";

}

});

window.copiar = function(){

navigator.clipboard.writeText(
document.getElementById("linkReferido").innerText
);

alert("Link copiado");

}

window.retirar = function(){

alert(
"Tu solicitud fue enviada al administrador"
);

}

</script>

</body>
</html>
