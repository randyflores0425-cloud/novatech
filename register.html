<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Registro - NOVATECH CLUB</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.caja{

background:white;
padding:30px;
border-radius:20px;
width:100%;
max-width:450px;
box-shadow:0 0 15px rgba(0,0,0,0.1);

}

h1{

text-align:center;
margin-bottom:25px;
color:#111;

}

.logo{

text-align:center;
font-size:28px;
font-weight:bold;
margin-bottom:20px;
color:#ff9800;

}

input{

width:100%;
padding:14px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #ccc;
font-size:15px;

}

button{

width:100%;
padding:14px;
background:#28a745;
border:none;
color:white;
font-size:16px;
border-radius:10px;
cursor:pointer;
font-weight:bold;

}

button:hover{

background:#218838;

}

.link{

text-align:center;
margin-top:20px;

}

.link a{

text-decoration:none;
color:#2196f3;
font-weight:bold;

}

.info{

background:#f0f0f0;
padding:15px;
border-radius:12px;
margin-bottom:20px;
font-size:14px;

}

</style>

</head>

<body>

<div class="caja">

<div class="logo">
NOVATECH CLUB
</div>

<h1>
Crear Cuenta
</h1>

<div class="info">

<p>
Regístrate para comenzar a invertir
y ganar un 8% diario.
</p>

</div>

<input
type="text"
id="nombre"
placeholder="Nombre completo"
>

<input
type="email"
id="email"
placeholder="Correo electrónico"
>

<input
type="password"
id="password"
placeholder="Contraseña"
>

<button onclick="registro()">

Registrarme

</button>

<div class="link">

¿Ya tienes cuenta?

<a href="login.html">

Iniciar sesión

</a>

</div>

</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getAuth,
createUserWithEmailAndPassword

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {

getFirestore,
doc,
setDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "TU_APIKEY",

authDomain: "TU_AUTHDOMAIN",

projectId: "TU_PROJECTID",

storageBucket: "TU_STORAGEBUCKET",

messagingSenderId: "TU_MESSAGINGSENDERID",

appId: "TU_APPID"

};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

window.registro =
async function(){

const nombre =
document.getElementById(
"nombre"
).value;

const email =
document.getElementById(
"email"
).value;

const password =
document.getElementById(
"password"
).value;

if(
nombre=="" ||
email=="" ||
password==""
){

alert(
"Completa todos los campos"
);

return;

}

try{

const userCredential =

await createUserWithEmailAndPassword(

auth,
email,
password

);

const user =
userCredential.user;

await setDoc(

doc(db,"usuarios",user.uid),

{

nombre:nombre,

email:email,

saldo:0,

plan:"Sin plan",

referidos:0,

ganancias:0,

retiros:0,

fecha:Date.now()

}

);

alert(
"Cuenta creada correctamente"
);

window.location.href =
"login.html";

}

catch(error){

alert(error.message);

}

}

</script>

</body>

</html>
