<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial;
background:#111;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.caja{
background:white;
padding:25px;
width:90%;
max-width:400px;
border-radius:15px;
}

h1{
text-align:center;
}

input{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
border:none;
background:#28a745;
color:white;
font-size:16px;
border-radius:10px;
cursor:pointer;
}

a{
display:block;
text-align:center;
margin-top:15px;
text-decoration:none;
}

</style>

</head>

<body>

<div class="caja">

<h1>Crear Cuenta</h1>

<input type="text"
id="nombre"
placeholder="Nombre completo">

<input type="email"
id="email"
placeholder="Correo">

<input type="password"
id="password"
placeholder="Contraseña">

<input type="text"
id="referido"
placeholder="Código referido">

<button onclick="registro()">
Registrarme
</button>

<a href="login.html">
Ya tengo cuenta
</a>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
setDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "TU_APIKEY",

authDomain: "TU_DOMINIO",

projectId: "TU_PROJECTID",

storageBucket: "TU_STORAGE",

messagingSenderId: "TU_SENDERID",

appId: "TU_APPID"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

window.registro = async function(){

let nombre =
document.getElementById("nombre").value;

let email =
document.getElementById("email").value;

let password =
document.getElementById("password").value;

let referido =
document.getElementById("referido").value;

if(nombre=="" || email=="" || password==""){

alert("Completa todos los campos");

return;

}

try{

const userCredential =
await createUserWithEmailAndPassword(
auth,
email,
password
);

const user = userCredential.user;

await setDoc(doc(db,"usuarios",user.uid),{

nombre:nombre,
email:email,
saldo:0,
ganancias:0,
referido:referido,
fecha:new Date()

});

alert("Cuenta creada");

window.location="login.html";

}catch(error){

alert(error.message);

}

}

</script>

</body>
</html>
