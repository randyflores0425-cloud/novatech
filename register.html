<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Registro</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.caja{
background:white;
padding:30px;
border-radius:20px;
width:90%;
max-width:400px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
border:none;
background:#28a745;
color:white;
font-size:16px;
border-radius:10px;
cursor:pointer;
}

a{
display:block;
text-align:center;
margin-top:15px;
text-decoration:none;
}

</style>

</head>

<body>

<div class="caja">

<h1>Crear Cuenta</h1>

<input
type="text"
id="nombre"
placeholder="Nombre completo"
>

<input
type="email"
id="email"
placeholder="Correo electrónico"
>

<input
type="password"
id="password"
placeholder="Contraseña"
>

<button id="btnRegistro">

Registrarse

</button>

<a href="login.html">

Ya tengo cuenta

</a>

</div>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getAuth,
createUserWithEmailAndPassword

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {

getFirestore,
doc,
setDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyDLfYfeuBHDPNbswPm9oCe-CbNJw0Z4fOk",

authDomain: "novatech-e0294.firebaseapp.com",

projectId: "novatech-e0294",

storageBucket: "novatech-e0294.firebasestorage.app",

messagingSenderId: "1050314267105",

appId: "1:1050314267105:web:852be575be54696e911aa0"

};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

document
.getElementById("btnRegistro")
.addEventListener("click", async()=>{

const nombre =
document.getElementById("nombre").value;

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

if(
nombre=="" ||
email=="" ||
password==""
){

alert("Completa todos los campos");

return;

}

try{

const userCredential =

await createUserWithEmailAndPassword(

auth,
email,
password

);

const user =
userCredential.user;

await setDoc(

doc(db,"usuarios",user.uid),

{

nombre:nombre,

email:email,

saldo:0,

plan:"Sin plan",

ganancias:0,

referidos:0,

fecha:Date.now()

}

);

alert("Cuenta creada correctamente");

window.location.href =
"login.html";

}

catch(error){

alert(error.message);

}

});

</script>

</body>

</html>
