<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
    <title>NOVATECH CLUB - Registro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="flex-center">

    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2>NOVATECH CLUB</h2>
            <p>Crea una cuenta para empezar a operar</p>
        </div>

        <form id="register-form" class="auth-form">
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="register-email" placeholder="Correo Electrónico" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="register-password" placeholder="Contraseña (Mínimo 6 caracteres)" required>
            </div>
            <button type="submit" class="submit-btn">Registrarse Ahora</button>
        </form>

        <div class="auth-footer">
            <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="firebase.js"></script>
    
    <script>
        // Lógica de registro integrada para register.html
        const auth = firebase.auth();
        const db = firebase.firestore();

        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Crear automáticamente el documento del usuario en Firestore con saldo 0
                    db.collection("usuarios").doc(email).set({
                        saldo: 0,
                        ingresos: 0
                    }).then(() => {
                        window.location.href = "index.html";
                    });
                })
                .catch((error) => {
                    alert("Error al registrarse: " + error.message);
                });
        });
    </script>
</body>
</html>
